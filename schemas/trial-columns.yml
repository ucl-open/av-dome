# What each BonsaiData_Trial column this workflow writes means (TrialRow.cs builds the row).
# ExperimentManifest (TrialColumns) copies this file into every experiment's manifest.json at
# Start, so each experiment carries the meaning of its own trial log; open_rigs.trials reads it
# from there (lib-open-rigs DECISIONS.md, stage 3).
#
# Each column: type (int, double, bool or string), and where they apply values (the strings it
# may hold, or a code: meaning map), unit, formerly (names it was recorded under before, newest
# first) and description. The names and types must also be on the lab's list
# (K:\config\data-dictionary.json, edited from rig-setup's Repos page): rig-control checks both
# before it launches the workflow.
#
# Naming: camelCase; a Harp time ends in Time and is in seconds; a duration or other quantity
# ends in its unit (itiSeconds, rewardSizeUl); never store a latency. Seconds, the row's own
# Harp time, is the one exception.

Seconds:
  type: double
  unit: s
  description: Harp time the row was stamped, when the outcome is known (the choice, or the end of the response window).
trialNumber:
  type: int
  formerly: [TrialCnt]
  description: The trial's number in the experiment, from 1.
trialType:
  type: string
  values: [visual, auditory, audiovisualCoherent, audiovisualConflict, neutral]
  description: What the trial showed, in words (InitialiseTrial.TrialTypeName) - one modality alone, both on the same side (coherent) or opposite sides (conflict), or neutral (grey screen; a centre sound in localization, silent in discrimination). In discrimination the target modality's trials and the other modality's say which they showed; the task file's targetModality (in the manifest) says which is the target. Until 9 Nov 2026 it was a code, 0 Visual (discrimination - target), 1 Audio (distractor), 2 AVCoherent, 3 AVConflict, 4 Neutral; those experiments' manifests carry that meaning.
target:
  type: string
  values: [Left, Right]
  formerly: [targetSide]
  description: The side that was right.
choice:
  type: string
  values: [Left, Right, NoResponse]
  formerly: [response]
  description: The side the mouse chose.
outcome:
  type: string
  values: [Correct, Incorrect, NoResponse]
  description: The trial's result.
stimulusOnsetTime:
  type: double
  unit: s
  formerly: [stimulusOnsetSeconds]
  description: Harp time the workflow commanded the stimulus on, NaN if it never was. The physical onset is in the hardware logs.
choiceTime:
  type: double
  unit: s
  description: Harp time of the lick the workflow counted as the choice; NaN on NoResponse.
rewardSizeUl:
  type: double
  unit: ul
  formerly: [rewardSize]
  description: Microlitres a reward on this trial gives, the stage's rewardSizeUl times reward.largeRewardMultiplier on a large-reward trial (largeReward said which until 9 Nov 2026). What was delivered is RewardDelivered in BonsaiData_Async.
bothSpouts:
  type: bool
  formerly: [BothSpouts]
  description: True when both spouts were offered (otherwise only the correct one).
repeatCount:
  type: int
  description: How many times in a row the trial has been repeated, 0 for a new draw.
itiSeconds:
  type: double
  unit: s
  formerly: [itiDuration]
  description: The inter-trial interval drawn before this trial (the last trial's draw, which the drink time comes out of), NaN on the first. Until 9 Nov 2026 it was the interval after the trial.
punishSound:
  type: bool
  description: True when the error sound played - an incorrect choice, with the task's punishment.sound enabled.
punishTimeoutSeconds:
  type: double
  unit: s
  description: The timeout after this trial - the task's punishment.timeoutSeconds after an incorrect choice or a miss that was not auto-rewarded; 0 otherwise.
visualAzimuth:
  type: double
  unit: deg
  description: Grating azimuth.
visualElevation:
  type: double
  unit: deg
  description: Grating elevation.
visualContrast:
  type: double
  description: Grating contrast, 0 to 1.
visualPhase:
  type: double
  unit: rad
  description: Grating phase.
audioAzimuth:
  type: double
  unit: deg
  description: Azimuth of the speaker that played, after snapping to the nearest wired one; NaN when none played.
audioElevation:
  type: double
  unit: deg
  description: Elevation of the speaker that played; NaN when none played.
audioWaveformIndex:
  type: int
  description: Index into the auditory stimulus set (calibration\AuditoryStimuli).
laserCondition:
  type: int
  formerly: [optoCondition]
  description: The Zapit condition stimulated, 0 when none (Zapit numbers conditions from 1). Until 9 Nov 2026 optoStimulated also said whether there was stimulation; it was always laserCondition > 0.
autoRewarded:
  type: bool
  description: True when a miss on an auto-reward trial was rewarded at the target spout.
