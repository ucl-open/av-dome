# yaml-language-server: $schema=data-schema.json
# Legacy task config, read at startup by the variant workflows (main_4Hz, main_ClosedLoop,
# main_NabbefeldG) via the absolute path C:\dev\av-dome\schemas\session.yml. main.bonsai has
# migrated to config/task.yml; this file and data-schema.json are to be retired or replaced when the 
# variants migrate. Only the fields marked USED below actually drive behaviour in TrialTypeInitialise.cs;
# everything else is never read.
GratingsSpecifications:
  duration: 1.5            # unused
  contrast:                # read, but overwritten per training stage in TrialTypeInitialise.cs; has no effect
    - 0
    - 0.1
    - 0.2
    - 0.4
    - 0.8
  extentX: 1               # unused
  extentY: 1               # unused
  orientation: 1           # unused (code uses 0)
  spatialFrequency: 0.0666666667   # unused (code constant)
  temporalFrequency: 0     # unused (code constant)
  flickerFrequency: 8      # unused (code constant)
  azimuth:                 # USED: candidate grating azimuths drawn per trial
    - -60
    - 60
  elevation: 15            # unused (code uses 15 regardless)
  aperture: 1              # unused
  opacity: 1               # unused
  phase: 1                 # unused (phase drawn randomly per trial)
  radius: 1                # unused
  presentation: true       # unused
AudioSpecifications:
  duration: 1.5            # unused
  azimuth:                 # USED: candidate speaker azimuths drawn per trial
    - -60
    - 0
    - 60
  elevation: 0             # unused (code uses 15)
  goCue: 0.1               # unused
  presentation: true       # unused
TrialStructure:
  trialTypeRatios:         # unused: weights come from the hard-coded stage table in TrialTypeInitialise.cs
    - 10
    - 10
    - 5
    - 5
    - 1
  iti:                     # USED: inter-trial interval drawn uniformly from this range, in seconds
    - 4.0
    - 5.0
  quiescent:               # unused (draw is commented out in the operator)
    - 0.1
    - 0.25
  openLoop: 0.5            # unused (code uses 0.0)
  closedLoop: 1            # unused (code uses 1.5)
  incorrectDelay: 2        # unused (code uses 4.0)
  timeout: 2               # unused (response timeout is a workflow literal)
Optogenetics:              # USED: all seven fields drive Zapit stimulation
  enabled: true
  zapitConfigPath: 'C:\Users\CoenLabUsers\zapit\examples\example_stimulus_config_files\left_right_pair.yml'
  stimProbability: 0.2
  stimDelay: 0.0
  stimDuration: 1.5
  excludeRepeats: true
  pseudorandomSelection: true
