[build-system]
requires = ["uv_build>=0.8.22"]
build-backend = "uv_build"

[project]
name = "ucl-open-av-dome"
description = "A library that defines a ucl-open data schema for the av-dome experiment."
authors = [ {name = "NeuroThom", email = "t.ryan@neurogears.org"}]
license = "MIT"
requires-python = ">=3.11, <3.12"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Operating System :: Microsoft :: Windows",
]
version = "0.0.0-rc1"
readme = {file = "README.md", content-type = "text/markdown"}

dependencies = [
  "swc-aeon>=0.2.0",
  "ucl-open",
  "pydantic-settings"
]

# [project.urls]
# Documentation = "https://ucl-open.github.io/Ucl.Open.AvDome/"
# Repository = "https://github.com/UclOpen/Ucl.Open.AvDome/"
# Issues = "https://github.com/UclOpen/Ucl.Open.AvDome/issues"
# Changelog = "https://github.com/UclOpen/Ucl.Open.AvDome/releases"
[project.scripts]
av-dome = "ucl_open_av_dome.cli:main"

[tool.ruff]
line-length = 120
target-version = 'py311'

[tool.ruff.lint]
extend-select = ['Q', 'RUF100', 'C90', 'I']
extend-ignore = []
mccabe = { max-complexity = 14 }
pydocstyle = { convention = 'google' }

[tool.codespell]
skip = '.git,*.pdf,*.svg,./bonsai,*.bonsai,./docs/_build,uv.lock,*Generated.cs'
ignore-words-list = 'nd'

[tool.uv]
required-version = '>=0.8.4'

[tool.uv.sources]
# TODO: revert to git main once the components/yaml additions are pushed upstream
ucl-open = { path = "../ucl-open", editable = true }
swc-aeon = { git = "https://github.com/SainsburyWellcomeCentre/aeon_api.git", branch = "main" }