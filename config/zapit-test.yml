# yaml-language-server: $schema=../src/DataSchemas/ucl_open_av_dome_task.json
# Task config for src/ZapitTrialTest.bonsai: identical to task-localization.yml except optogenetics is enabled.
# Edit zapitStimConfigPath to the stimulus config file that is loaded in Zapit, then follow docs/zapit-testing.md.
# Task parameters for the av-dome audiovisual localisation task.
# Loaded by src/main.bonsai at startup and published as the TaskConfig subject.
# The task as read at Go is written to the experiment folder as Settings\Settings_Task_<DateTime>.json.
taskParameters:
  rngSeed: null            # null = draw a random seed; each seed used is a RngSeed event in BonsaiData_Async
  trialStructure:
    itiMin: 4.0            # s
    itiMax: 5.0            # s
    quiescentMin: 0.1      # s
    quiescentMax: 0.25     # s
    openLoopDuration: 0.0  # s
    closedLoopDuration: 1.5   # s
    spoutInDelay: 0.5      # s, from stimulus onset to spouts in
  visualStimulus:
    azimuthMin: -60        # deg, grating azimuth drawn uniformly in [min, max]
    azimuthMax: 60         # deg
    overwriteAzimuths: [-60, 60]   # deg, discrete grating azimuths; when set, used instead of [min, max]
    elevationMin: 15       # deg, grating elevation drawn uniformly in [min, max]
    elevationMax: 15       # deg
    coherentAzimuthCap: 80 # deg, |azimuth| kept below this on coherent trials
    gaussianWindowSigma: 20   # deg
    orientation: 0         # deg
    spatialFrequency: 0.066666667   # cycles/deg
    temporalFrequency: 0   # Hz, unsigned drift rate; direction is orthogonal to orientation
  audioStimulus:
    speakerLocations:      # lateral positions, one drawn per audio trial; no centre entry (fixed in code); playback uses the nearest wired speaker
      - { azimuth: -60, elevation: 15 }
      - { azimuth: 60, elevation: 15 }
  response:
    thresholdLicks: 1      # net lick difference ending the response window; 1 = first-lick 2AFC
    degreesPerLick: 0      # deg the grating moves per net lick; 0 = stimulus fixed
  punishment:
    timeoutSeconds: 4.0   # s, after an incorrect choice or a miss (not after an auto-rewarded miss)
    sound:               # the error sound, on an incorrect choice
      enabled: false
      path: LocalFiles\error_tone.wav
      channel: 2
      gain: 1.0
  reward:
    rewardProbability: 1.0
    largeRewardMultiplier: 1
    largeRewardProbability: 0.0
  repeats:
    maxRepeats: 5
    rulesPerType: [onFailure, onFailure, onFailure, onTimeout, onTimeout]
  optogenetics:
    enabled: true
    zapitStimConfigPath: C:\Users\CoenLabUsers\zapit\examples\example_stimulus_config_files\left_right_pair.yml # EDIT: the stim config file loaded in Zapit
    laserOnProbability: 1
    laserDelaySeconds: 0.0         # s
    laserDurationSeconds: 1.5      # s
    noLaserOnRepeats: true
    balancedConditions: true
  trainingStages:          # row index = stage id selected in the GUI; ids past the end use the last row
    - label: Stage 0       # habituation, coherent only, single spout half the time, no repeats
      trialWeights: [0, 0, 10, 0, 0]
      autoRewardProbability: 0.0
      bothSpoutsProbability: 0.5
      rewardSizeUl: 4      # delivered as ceil(size/2) valve pulses
      contrasts: [3.0]
      allowRepeats: false
    - label: Stage 1       # coherent trials only
      trialWeights: [0, 0, 10, 0, 0]
      autoRewardProbability: 0.0
      bothSpoutsProbability: 1.0
      rewardSizeUl: 4
      contrasts: [3.0]
      allowRepeats: true
    - label: Stage 2       # unisensory auditory added
      trialWeights: [0, 10, 10, 0, 0]
      autoRewardProbability: 0.0
      bothSpoutsProbability: 1.0
      rewardSizeUl: 4
      contrasts: [0, 0.25, 0.5, 1.0]
      allowRepeats: true
    - label: Stage 3       # unisensory visual added
      trialWeights: [10, 10, 10, 0, 0]
      autoRewardProbability: 0.0
      bothSpoutsProbability: 1.0
      rewardSizeUl: 4
      contrasts: [0, 0.25, 0.5, 1.0]
      allowRepeats: true
    - label: Stage 4       # conflict and neutral trials added
      trialWeights: [10, 10, 5, 5, 1]
      autoRewardProbability: 0.0
      bothSpoutsProbability: 1.0
      rewardSizeUl: 4
      contrasts: [0, 0.25, 0.5, 1.0]
      allowRepeats: true
