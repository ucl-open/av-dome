# How rig-control's window shows this workflow's experiments: the page's layout, its commands,
# its parameters and its charts. Read by the rig's agent at each experiment; edit, commit, and the
# next experiment shows the change on every rig. Nothing here changes what the workflow does.
#
# The window computes every number itself (trials, performance, water, licks) from the two
# experiment files, BonsaiData_Trial and BonsaiData_Async; the workflow computes none of them.
# rig-control's src/open_rigs_control/performance.py says how; trials.py reads the files.

[layout]
camera_height_share = 0.55  # 0.2 to 0.8: the cameras' share of the page's height; charts get the rest

# ---- The trial log ---------------------------------------------------------------------------
# Which column of BonsaiData_Trial means what. A column the log lacks is read as blank.
[trials]
log = "BonsaiData_Trial"           # LogData name: files BonsaiData\BonsaiData_Trial_<hour>.csv
older_logs = ["TrialSettings"]     # read for older experiments that have no BonsaiData_Trial
number = "trialNumber"             # trial number
outcome = "outcome"                # the trial's result, as named under [trials.outcomes]
choice = "choice"                  # the side the mouse chose: Left, Right or NoResponse
target = "target"                  # the side that was right: Left or Right
two_spout = "bothSpouts"           # True when both spouts were offered (performance counts only these)
auto = "autoReward"                # True when the reward was given automatically
type = "trialType"                 # the trial type, for "Performance by Trial Type"
type_metric = "trial_type"         # the status metric that is the trial type: Current Trial names it below
onset = "stimulusOnsetSeconds"     # stimulus onset, Harp seconds (licks are aligned to it)
end = "Seconds"                    # the trial's end, Harp seconds

# What each outcome means: correct, incorrect, auto (auto-rewarded after an error) or none.
# Performance = correct / (correct + incorrect), two-spout trials only, as production computed it.
[trials.outcomes]
Correct = "correct"
Incorrect = "incorrect"
IncorrectAutoRewarded = "auto"
NoResponse = "none"

# Names for trial types on the charts; a type not named here shows as "Type 0", "Type 1"...
# The numbers are trialType as drawn in src/Extensions/InitialiseTrial.cs (GenerateNewTrial).
# Keep them short: they sit under the bars of the Trial Types chart.
[trials.type_labels]
0 = "Visual"         # unisensory visual
1 = "Audio"          # unisensory auditory
2 = "AV Coherent"    # multisensory, visual and audio on the same side
3 = "AV Conflict"    # multisensory, opposite sides; the target is the visual side
4 = "Neutral"        # grey screen, sound from the centre; the target side is random

# ---- The async log ---------------------------------------------------------------------------
[async]
log = "BonsaiData_Async"
water_event = "RewardDelivered"    # its Value is the microlitres delivered; counted after Go only

# ---- Live data -------------------------------------------------------------------------------
[live]
wheel = "BehaviorBoard-Main"       # the live view's <name>.encoder stream (port 5556)
wheel_unit = "counts/s"            # set wheel_scale to convert counts/s, e.g. to cm/s
wheel_scale = 1.0

# Lick detectors by side: each is an experiment device folder whose LickState register (32) is
# raw-logged; licks per trial and the lick raster come from these files.
[live.licks]
left = "LicketySplit-Left"
right = "LicketySplit-Right"

# ---- Charts ----------------------------------------------------------------------------------
# One tab per line, in this order, each showing its charts side by side. The charts:
#   response_history     production's Response History, the last 60 trials
#   rolling_performance  performance and responses over the last 20 trials
#   performance_by_type  performance per trial type
#   licks                licks around stimulus onset, and licks per trial
#   wheel                wheel speed over the last minute, live
#   history              this mouse's earlier experiments: performance and trials
[charts.tabs]
"Performance" = ["response_history", "rolling_performance"]
"Trial Types" = ["performance_by_type"]
"Licks" = ["licks"]
"Wheel" = ["wheel"]
"Across Experiments" = ["history"]

# ---- The current trial -----------------------------------------------------------------------
# The workflow's status metrics, shown in a line under the tiles while it runs.
# Each line: the workflow's metric name = the label shown. A metric not listed is not shown.
[metrics]
target_side = "Target"
trial_type = "Trial Type"
visual_azimuth = "Visual (°)"
audio_azimuth = "Audio (°)"
reward_size_ul = "Reward (µl)"
auto_reward = "Auto Reward"

# ---- Parameters ------------------------------------------------------------------------------
# Shown in this order. Each field optional:
#   label        the name shown (else the workflow's)
#   unit         shown after the field
#   placeholder  shown in an empty field
#   help         the tooltip
#   choices      a list to pick from instead of a text field; `labels` names each choice
#   tick         a tick-box instead: [value unticked, value ticked]
#   task_value   where in the task file the value a blank field keeps is, shown in the field;
#                a {Name} part is that parameter's value (a row past the end is the last row)
# All of them can be changed until Go, and are fixed from then on.
# The stages are config\task.yml's trainingStages rows; a label here is that row's comment, so
# change both together. An id past the last row runs the last row, so none is offered.
[task]
folder = "config"        # the task files, in this repository
pattern = "task*.yml"    # which files there are task files: Task File picks from them
file = "TaskFile"        # the parameter naming the one the experiment runs

[parameters.TrainingStage]
label = "Training Stage"
choices = ["0", "1", "2", "3", "4"]
labels = { "0" = "0 · Habituation", "1" = "1 · Coherent Only", "2" = "2 · Auditory Added", "3" = "3 · Visual Added", "4" = "4 · Conflict Added" }
help = "The task file's training stage (task.yml trainingStages). 0 Habituation: coherent trials, one spout half the time. 1: coherent only (audio and visual on the same side). 2: auditory trials added. 3: visual trials added. 4: conflict and neutral trials added."

[parameters.TaskFile]
label = "Task File"
help = "Which task file in config\\ the experiment runs: task.yml is the task; the others are for tests (task-closedloop.yml, task-zapit-test.yml). Read at Go."

[parameters.RewardSizeUl]
label = "Reward Size"
unit = "µl"
placeholder = "As the task file"
task_value = "taskParameters.trainingStages.{TrainingStage}.rewardSizeUl"
help = "Water per reward. Blank keeps the task file's (this stage's rewardSizeUl), shown in grey."

[parameters.ItiMin]
label = "ITI Min"
unit = "s"
placeholder = "As the task file"
task_value = "taskParameters.trialStructure.itiMin"
help = "Shortest inter-trial interval. Blank keeps the task file's, shown in grey."

[parameters.ItiMax]
label = "ITI Max"
unit = "s"
placeholder = "As the task file"
task_value = "taskParameters.trialStructure.itiMax"
help = "Longest inter-trial interval. Blank keeps the task file's, shown in grey."

[parameters.Zapit]
label = "Zapit"
tick = ["off", "on"]
task_value = "taskParameters.optogenetics.enabled"
help = "Optogenetics through Zapit. Off unless ticked; ticked, the window checks Zapit is running on this rig before Go, and does not send Go if it is not."
# What Zapit needs when on: its TCP server, where this rig's rig.yml says (zapit.host, zapit.port).
# The window asks the rig before Go and marks the box "Not Answering" if nothing is listening.
needs = { address = "zapit.host:zapit.port", when = "on", name = "Zapit" }

[parameters.StepSize]
label = "Step Size"
unit = "steps"
help = "How far one spout button moves a spout. Fixed from Go."

# ---- Commands --------------------------------------------------------------------------------
# Groups of buttons, top to bottom. `rows` places them ("" leaves a cell empty). Each button's
# fields, under [commands.buttons.<Command>], all optional:
#   label    the button's text (else the command's name)
#   key      a shortcut, such as "Ctrl+L"
#   help     the tooltip
#   confirm  a question asked before it is sent (for buttons that are costly to press by mistake)
#
# A group's [commands.arrows] lets the arrow keys drive some of its buttons: each target is
#   "Name" = { key = "1", up = "<command>", down = ..., left = ..., right = ... }
# The key (or a click on one of the target's buttons) chooses it; each arrow press then presses
# that button once (holding the key does not repeat); Esc lets go. Never while typing in a field.

[[commands]]
title = "Water"
rows = [["RewardLeft", "RewardRight"]]

[commands.buttons.RewardLeft]
label = "Reward Left"
key = "Ctrl+Shift+L"   # with Shift: Ctrl+R alone is the refresh reflex, and this gives water
help = "One reward of the current size on the left spout, logged in BonsaiData_Async."

[commands.buttons.RewardRight]
label = "Reward Right"
key = "Ctrl+Shift+R"
help = "One reward of the current size on the right spout, logged in BonsaiData_Async."

# The spout pad, production's arrows, mirrored left to right as production's was:
#
#         Left Spout          Right Spout
#      [↑ Up]   [↓ Down]   [↑ Up]   [↓ Down]
#      [↙ Front][↗ Back]   [↖ Back] [↘ Front]
[[commands]]
title = "Spouts"
columns = ["Left Spout", "Right Spout"]
rows = [
  ["LeftUp",    "LeftDown", "RightUp",   "RightDown"],
  ["LeftFront", "LeftBack", "RightBack", "RightFront"],
]

# Left and right press the button on that side of the spout's pad, so a key is where its button is.
[commands.arrows]
"Left Spout"  = { key = "1", up = "LeftUp",  down = "LeftDown",  left = "LeftFront", right = "LeftBack" }
"Right Spout" = { key = "2", up = "RightUp", down = "RightDown", left = "RightBack", right = "RightFront" }

[commands.buttons.LeftUp]
label = "↑ Up"
help = "Raise the left spout by one step size."

[commands.buttons.LeftDown]
label = "↓ Down"
help = "Lower the left spout by one step size."

[commands.buttons.LeftFront]
label = "↙ Front"
help = "Move the left spout to the front by one step size."

[commands.buttons.LeftBack]
label = "↗ Back"
help = "Move the left spout back by one step size."

[commands.buttons.RightUp]
label = "↑ Up"
help = "Raise the right spout by one step size."

[commands.buttons.RightDown]
label = "↓ Down"
help = "Lower the right spout by one step size."

[commands.buttons.RightBack]
label = "↖ Back"
help = "Move the right spout back by one step size."

[commands.buttons.RightFront]
label = "↘ Front"
help = "Move the right spout to the front by one step size."

# The base moves both spouts; the positions are this mouse's saved ones.
#
#      [← Base]           [Base →]
#      [Home] [In] [Out] [Save]
[[commands]]
title = "Base and Positions"
rows = [
  ["BaseLeft",   "BaseRight"],
  ["SpoutsHome", "SpoutsIn", "SpoutsOut", "SaveSpoutPositions"],
]

[commands.arrows]
"Base" = { key = "3", left = "BaseLeft", right = "BaseRight" }

[commands.buttons.BaseLeft]
label = "← Base"
help = "Move the base, both spouts, left by one step size."

[commands.buttons.BaseRight]
label = "Base →"
help = "Move the base, both spouts, right by one step size."

[commands.buttons.SpoutsHome]
label = "Home"
help = "Drive every spout motor to its zero switch."
confirm = "Drive every spout motor to its zero switch? The spouts leave their current positions."

[commands.buttons.SpoutsIn]
label = "In"
key = "Ctrl+I"
help = "Both spouts to this mouse's In positions."

[commands.buttons.SpoutsOut]
label = "Out"
key = "Ctrl+O"
help = "Both spouts to this mouse's Out positions."

[commands.buttons.SaveSpoutPositions]
label = "Save"
help = "Save the spouts' current positions as this mouse's, read at its next experiment's Start."
confirm = "Save the spouts' current positions as this mouse's, replacing its saved ones?"
